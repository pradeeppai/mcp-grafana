# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => {
      const args = ['--transport','stdio'];
      if (config.debug) args.push('--debug');
      if (config.logLevel) args.push('--log-level', config.logLevel);
      ['search','datasource','incident','prometheus','loki','alerting','dashboard','oncall','asserts','sift','admin'].forEach(cat => {
        const key = `disable${cat.charAt(0).toUpperCase()}${cat.slice(1)}`;
        if (config[key]) args.push(`--disable-${cat}`);
      });
      return {command: '/app/mcp-grafana', args, env: {GRAFANA_URL: config.grafanaUrl, GRAFANA_API_KEY: config.grafanaApiKey}};
    }
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - grafanaUrl
      - grafanaApiKey
    properties:
      grafanaUrl:
        type: string
      grafanaApiKey:
        type: string
      debug:
        type: boolean
        default: false
      logLevel:
        type: string
        default: info
      disableSearch:
        type: boolean
        default: false
      disableDatasource:
        type: boolean
        default: false
      disableIncident:
        type: boolean
        default: false
      disablePrometheus:
        type: boolean
        default: false
      disableLoki:
        type: boolean
        default: false
      disableAlerting:
        type: boolean
        default: false
      disableDashboard:
        type: boolean
        default: false
      disableOncall:
        type: boolean
        default: false
      disableAsserts:
        type: boolean
        default: false
      disableSift:
        type: boolean
        default: false
      disableAdmin:
        type: boolean
        default: false
  exampleConfig:
    grafanaUrl: http://localhost:3000
    grafanaApiKey: token
    debug: false
    logLevel: info
    disableSearch: false
    disableDatasource: false
    disableIncident: false
    disablePrometheus: false
    disableLoki: false
    disableAlerting: false
    disableDashboard: false
    disableOncall: false
    disableAsserts: false
    disableSift: false
    disableAdmin: false
